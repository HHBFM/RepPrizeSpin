<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BFM Prize Wheel</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:#f7f7f7;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px}h1{text-align:center;letter-spacing:3px}.sub{text-align:center;color:#9da8b8}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.card{background:#151a25;border:1px solid #293142;border-radius:20px;padding:20px}.wheelbox{position:relative;display:flex;justify-content:center;align-items:center;min-height:540px}.pointer{position:absolute;top:8px;left:50%;transform:translateX(-50%);border-left:18px solid transparent;border-right:18px solid transparent;border-top:42px solid #f4c44e;z-index:2}canvas{max-width:100%;height:auto}label{display:block;margin:12px 0;color:#aeb7c4;font-weight:bold;font-size:13px}input,select,button{width:100%;padding:13px;margin-top:6px;border-radius:10px;border:1px solid #30394a;background:#0e131c;color:white;font-size:16px}button{cursor:pointer;font-weight:bold}.spin{background:#f4c44e;color:#111;border:0;font-size:18px}.check{display:flex;gap:8px;align-items:center}.check input{width:auto;margin:0}.status,.summary{margin-top:14px;background:#0e131c;border:1px solid #293142;border-radius:10px;padding:13px}.ledger{margin-top:12px;max-height:280px;overflow:auto;border:1px solid #293142;border-radius:10px}.result{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #293142}.odds{font-size:12px;color:#8d98a8;margin-top:14px;line-height:1.5}@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>BFM PRIZE WHEEL</h1><p class="sub">Select a player, choose the number of spins, and play.</p><div class="grid"><div class="card wheelbox"><div class="pointer"></div><canvas id="wheel" width="520" height="520"></canvas></div><div class="card"><label>PLAYER<input id="player" list="players" placeholder="Enter or select player"><datalist id="players"><option>George</option><option>Chris</option><option>Donald</option><option>Ernie</option><option>Travis</option><option>Eli</option><option>Martin</option></datalist></label><label>NUMBER OF SPINS<select id="count"><option>1</option><option>2</option><option>3</option><option>5</option><option selected>10</option><option>15</option><option>20</option><option>25</option><option>50</option></select></label><label>ANIMATION SPEED<select id="speed"><option value="1800">Fast</option><option value="3000" selected>Normal</option><option value="4500">Dramatic</option></select></label><label class="check"><input type="checkbox" id="skip"> Skip animation and generate prize list instantly</label><button class="spin" id="spin">SPIN THE WHEEL</button><button id="clear">Clear Results</button><div id="status" class="status">Ready to spin.</div><h3>Spin Results</h3><div id="ledger" class="ledger"><div class="result"><span>—</span><b>No spins yet</b></div></div><div id="summary" class="summary">Cash total: <b>$0</b></div><div class="odds">Weighted odds: $1 30% · $3 22% · $5 16% · $7 12% · $10 8% · Jersey Mike's Sub 6% · GTA VI 4% · A Secret Prize Point 2%.</div></div></div></div><script>
const prizes=[{label:'$1',weight:30,cash:1},{label:'$3',weight:22,cash:3},{label:'$5',weight:16,cash:5},{label:'$7',weight:12,cash:7},{label:'$10',weight:8,cash:10},{label:"Jersey Mike's Sub",weight:6},{label:'GTA VI',weight:4},{label:'A Secret Prize Point',weight:2}],colors=['#d9a72e','#263246','#c94141','#3c475c','#e3b746','#263246','#b93434','#566176'];const cv=document.getElementById('wheel'),ctx=cv.getContext('2d'),arc=Math.PI*2/prizes.length;let rot=0,busy=false,res=[];
function draw(){ctx.clearRect(0,0,520,520);ctx.save();ctx.translate(260,260);ctx.rotate(rot);prizes.forEach((p,i)=>{let a=-Math.PI/2+i*arc;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,245,a,a+arc);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='#0b0e14';ctx.lineWidth=5;ctx.stroke();ctx.save();ctx.rotate(a+arc/2);ctx.textAlign='right';ctx.fillStyle='white';ctx.font=i>4?'bold 15px Arial':'bold 23px Arial';let words=p.label.split(' '),lines=[],line='';for(let w of words){if(ctx.measureText(line+w).width>155&&line){lines.push(line);line=w+' '}else line+=w+' '}lines.push(line);lines.forEach((l,j)=>ctx.fillText(l.trim(),210,(j-(lines.length-1)/2)*18));ctx.restore()});ctx.beginPath();ctx.arc(0,0,58,0,Math.PI*2);ctx.fillStyle='#0e131c';ctx.fill();ctx.strokeStyle='#f4c44e';ctx.lineWidth=7;ctx.stroke();ctx.fillStyle='#f4c44e';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('BFM',0,0);ctx.restore()}
function pick(){let x=Math.random()*100,s=0;for(let i=0;i<prizes.length;i++){s+=prizes[i].weight;if(x<s)return i}return 0}function target(i){let tau=Math.PI*2,c=((rot%tau)+tau)%tau,d=((-(i+.5)*arc)%tau+tau)%tau;return rot+tau*(5+Math.floor(Math.random()*3))+(d-c+tau)%tau}function animate(i,dur){return new Promise(ok=>{let st=performance.now(),fr=rot,to=target(i);function f(now){let t=Math.min(1,(now-st)/dur),e=1-Math.pow(1-t,4);rot=fr+(to-fr)*e;draw();t<1?requestAnimationFrame(f):ok()}requestAnimationFrame(f)})}function render(){let l=document.getElementById('ledger');if(!res.length){l.innerHTML='<div class="result"><span>—</span><b>No spins yet</b></div>';document.getElementById('summary').innerHTML='Cash total: <b>$0</b>';return}l.innerHTML=res.map((r,i)=>`<div class="result"><span>Spin ${i+1}</span><b>${r.label}</b></div>`).join('');let cash=res.reduce((s,r)=>s+(r.cash||0),0),bonus=res.filter(r=>!r.cash).map(r=>r.label);document.getElementById('summary').innerHTML=`Cash total: <b>$${cash}</b>${bonus.length?'<br>Bonus prizes: <b>'+bonus.join(', ')+'</b>':''}`;l.scrollTop=l.scrollHeight}
async function run(){if(busy)return;let player=document.getElementById('player').value.trim();if(!player){document.getElementById('status').textContent='Please select or enter a player.';return}busy=true;document.getElementById('spin').disabled=true;res=[];render();let n=+document.getElementById('count').value,skip=document.getElementById('skip').checked,dur=+document.getElementById('speed').value,picks=Array.from({length:n},pick);if(skip){res=picks.map(i=>prizes[i]);render();document.getElementById('status').textContent=`${player}: ${n} spins generated.`}else for(let s=0;s<n;s++){document.getElementById('status').textContent=`${player} — spinning ${s+1} of ${n}…`;await animate(picks[s],dur);res.push(prizes[picks[s]]);render();document.getElementById('status').textContent=`Spin ${s+1}: ${prizes[picks[s]].label}`;await new Promise(r=>setTimeout(r,450))}if(!skip)document.getElementById('status').textContent=`${player} finished ${n} spin${n==1?'':'s'}!`;busy=false;document.getElementById('spin').disabled=false}document.getElementById('spin').onclick=run;document.getElementById('clear').onclick=()=>{if(!busy){res=[];render();document.getElementById('status').textContent='Ready to spin.'}};draw();
</script></body></html>
